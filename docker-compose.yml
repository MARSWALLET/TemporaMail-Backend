services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/api/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-temporamail}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-temporamail}
      RSPAMD_URL: http://rspamd:11334
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/smtp/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SMTP_PORT: "25"
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-temporamail}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-temporamail}
      RSPAMD_URL: http://rspamd:11334
    ports:
      - "25:25"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rspamd:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-ttl
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporamail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-temporamail}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporamail} -d ${POSTGRES_DB:-temporamail}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  rspamd:
    image: rspamd/rspamd:latest
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
